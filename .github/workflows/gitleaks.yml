# Secret scanning with gitleaks — runs on every push and PR to main.
# Requires GITLEAKS_LICENSE for organization repos (free at gitleaks.io).
# Alternative: use GitHub's built-in push protection (free, no license needed).

name: gitleaks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # The job key IS the status-check context: GitHub names a check after `name:` when a job has one and
  # falls back to the key otherwise. jolarca-control/repos/jolarca-security.yml declares required contexts
  # (D-47), so the names here must be stable identifiers, not prose -- a reworded title would silently
  # un-required a check. `secret-scan` matches the key used by jolarca-identity and jolarca-hermes-agents.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
